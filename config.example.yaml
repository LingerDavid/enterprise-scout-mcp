# Copy to config.yaml and adjust paths to sibling projects on your machine.

data_root: "G:/enterprise_lake"
state_dir: "./.state"
state_persist: true  # persist daily quotas + routing success rates

# Unified cookie/session store — single place for paths (wires integrations.* on load)
sessions:
  dir: "./.state"
  gsxt: "gsxt_personal_session.json"       # L1 GSXT personal login (JSON)
  aiqicha: "./secrets/aiqicha_cookies.txt" # L2 爱企查 cookie header (text)
  export_inbox: "./.state/session_exports"   # drop browser JSON exports here

personas:
  dir: "./personas"
  default: "desktop_chrome_cn"

behavior:
  global_daily_quota: 5000
  persona_daily_quota: 200
  min_delay_seconds: 2.0
  max_delay_seconds: 8.0
  cooldown_after_captcha_seconds: 600
  cooldown_after_block_seconds: 1800

routing:
  # ensan_only: L2 ENScan for aiqicha/tyc/… ; use --prefer-tier l1 -p gsxt for L1 official
  source_policy: ensan_only
  ensan_only: true
  gsxt_allow_unavailable: true
  l1_fallback_to_l2: true   # L1 registry fail → ENScan L2 (degraded=true)
  min_success_rate_for_enscan: 0.0
  prefer_enscan_for: ["icp", "app", "wechat", "invest", "branch", "partner", "holds"]
  force_playwright_for: []

integrations:
  # L1 GSXT — personal login session (shiming.gsxt.gov.cn → export cookies)
  gsxt:
    enabled: true
    base_url: "https://www.gsxt.gov.cn"
    shiming_url: "https://shiming.gsxt.gov.cn"
    session_mode: personal
    session_file: "./.state/gsxt_personal_session.json"
    search_url: "https://www.gsxt.gov.cn/api/search/testAi"
    search_mode: browser          # browser (default) | api | auto
    browser_backend: auto         # auto | nodriver | playwright_cdp
    browser_headless: false       # true 易触发 NWAF；首次用 false 建 profile
    browser_search_timeout: 45
    # Ruishu/NWAF 根治：先手动启动真实 Chrome，再 Playwright connect_over_cdp
    browser_cdp_host: "127.0.0.1"
    browser_cdp_port: 0           # 9222 = 接管已打开的 Chrome（escout sessions cdp-hint）
    proxy_url: ""                 # 或 http://127.0.0.1:7897；空则读 HTTP(S)_PROXY 环境变量
    proxy_from_env: true
    captcha_mode: manual
    browser_warmup_on_ct: true
    browser_warmup_wait_seconds: 6

  # ENScan_GO — sibling checkout: e:/Project/ENScan_GO (required when ensan_only)
  ensan_go:
    enabled: true
    base_url: "http://127.0.0.1:31000"
    default_type: "aqc"  # aqc | tyc | kc | rb
    timeout_seconds: 120
    config_path: "../ENScan_GO/config.yaml"

  # proxy_pool — unused under ensan_only (ENScan owns egress)
  proxy_pool:
    enabled: false
    base_url: "http://127.0.0.1:5010"

  # Handaas API — optional paid complement, not a scrape fallback
  handaas:
    enabled: false
    integrator_id: ""
    secret_id: ""
    secret_key: ""

  # Interactive scrape channel — disabled; kept for optional force_channel only
  playwright:
    enabled: false
    headless: true
    cookie_file: "./secrets/aiqicha_cookies.txt"
    aiqicha_scraper_dir: "../aiqicha_scraper"
    companies_db: "../aiqicha_scraper/companies.db"
    fetch_on_miss: false
    fetch_script: "./scripts/aiqicha_fetch_one.py"
    nodriver_script: "./scripts/aiqicha_fetch_nodriver.py"
    nodriver_on_captcha: false
    nodriver_user_data_dir: "./nodriver_data"
    fetch_timeout_seconds: 90

  curl_cffi:
    enabled: false
    impersonate: "chrome131"

  # Camoufox anti-detect Firefox — pip install -e ".[camoufox]"
  camoufox:
    enabled: false
    headless: true
    humanize: true

  # Captcha branch: rotate_ip | solver_api | opencv_slider | manual
  # solver: set CAPSOLVER_API_KEY or solver_api_key; pip install -e ".[captcha]" for OpenCV
  captcha:
    strategy: rotate_ip
    solver_provider: ""          # capsolver
    solver_api_key: ""

  # L3 academic + judicial + listed filings corpus (JSON / JSONL)
  corpus:
    enabled: true
    l3_dir: "G:/enterprise_lake/corpus/l3"
    judicial_dir: "G:/enterprise_lake/corpus/judicial"
    listed_dir: "G:/enterprise_lake/corpus/listed"

output:
  warehouse_dir: "G:/enterprise_lake/warehouse"
  raw_dir: "G:/enterprise_lake/raw"
  parquet_enabled: true
  grade_routes:
    ok: "warehouse"
    partial: "raw"
    captcha: "retry_queue"
    auth_expired: "retry_queue"
    blocked: "dead_letter"

# Neo4j — matches EnterpriseLake docker-compose defaults
neo4j:
  enabled: false
  auto_import: false  # true → merge warehouse after ok/partial collect & batch
  uri: "bolt://127.0.0.1:7687"
  user: "neo4j"
  password: "enterprise-lake-dev"
