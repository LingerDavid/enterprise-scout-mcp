# Proposed Hermes optional-mcp catalog entry (PR to hermes-agent/optional-mcps/).
# Replace `source` / `install.url` / `ref` with your published git repo + pinned SHA
# before upstream merge. Local dev: `escout register-hermes`.
manifest_version: 1

name: enterprise-scout-mcp
description: Orchestrated enterprise registry intelligence (ENScan, aiqicha, Handaas).
source: https://github.com/LingerDavid/enterprise-scout-mcp

transport:
  type: stdio
  command: "${INSTALL_DIR}/.venv/bin/python"
  args:
    - "-m"
    - "enterprise_scout_mcp.mcp.server"

install:
  type: git
  url: https://github.com/LingerDavid/enterprise-scout-mcp.git
  ref: c334af3a5fc6cf53df94981c997d166be99dbb17
  bootstrap:
    - "python3 -m venv .venv"
    - ".venv/bin/pip install -e '.[warehouse]'"

auth:
  type: none

post_install: |
  Copy config.example.yaml to config.yaml beside the install dir.
  Point integrations.ensan_go at ENScan_GO :31000 and playwright paths at aiqicha_scraper.
  Run `escout sync-cookies` after exporting aiqicha cookies.
  Optional browser fallback: `.venv/bin/pip install -e '.[browser]'`.
  Start a new Hermes session to load enterprise_collect / scout_doctor tools.

suggest:
  keywords:
    - enterprise
    - 工商
    - 股权穿透
    - aiqicha
    - enscan
