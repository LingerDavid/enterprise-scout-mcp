[project]
name = "enterprise-scout-mcp"
version = "0.1.0"
description = "MCP server for orchestrated enterprise registry intelligence (ENScan / Playwright / Handaas)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1,<1",
    "pyyaml>=6.0.2,<7",
    "pydantic>=2.10.0,<3",
    "mcp>=1.6.0,<2",
    "python-dotenv>=1.0.0,<2",
]

[project.optional-dependencies]
transport = [
    "curl-cffi>=0.16.1,<1",
]
browser = [
    "playwright>=1.49.0,<2",
    "nodriver>=0.38,<1",
]
warehouse = [
    "pyarrow>=18.0.0,<22",
]
dev = [
    "pytest>=8.3.0,<9",
    "pyarrow>=18.0.0,<22",
]

[project.scripts]
enterprise-scout-mcp = "enterprise_scout_mcp.mcp.server:main"
escout = "enterprise_scout_mcp.cli:main"

[build-system]
requires = ["hatchling>=1.26.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_scout_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
